services:
  - type: web
    name: parcelvault-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        value: https://osnclsmdzibqczkuxwvb.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: support@parcelvaultlogistics.com
      - key: SUPPORT_EMAIL
        value: support@parcelvaultlogistics.com
      - key: PUBLIC_SITE_URL
        value: https://www.parcelvaultlogistics.com
      - key: NODE_VERSION
        value: 22
